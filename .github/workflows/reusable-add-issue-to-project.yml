---
name: Reusable - Add New Issue to Project

on:
  workflow_call:
    inputs:
      issue-number:
        description: "Issue number to process; defaults to the triggering issues event"
        required: false
        type: string
        default: ""
      project-owner:
        description: "GitHub organization/user that owns the project; defaults to the issue repository owner"
        required: false
        type: string
        default: ""
      project-title:
        description: "GitHub Project V2 title"
        required: true
        type: string
      project-fields-json:
        description: "Optional JSON object/array of single-select field updates (e.g. {'Status':'To do'} or [{\"name\":\"Status\",\"value\":\"To do\"}])"
        required: false
        type: string
        default: "[]"
    secrets:
      app-client-id:
        description: "GitHub App Client ID"
        required: true
      app-private-key:
        description: "GitHub App private key"
        required: true
      slack-webhook-url:
        description: "Slack webhook URL for failure notifications"
        required: false

permissions: {}

jobs:
  add-issue-to-project:
    name: Add Issue to Project
    runs-on: ubuntu-latest
    if: github.event_name != 'issues' || (github.event.issue.user.type != 'Bot' && !endsWith(github.event.issue.user.login, '[bot]'))
    permissions:
      contents: read
    steps:
      - name: Parse repository
        id: repo
        env:
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets['app-client-id'] }}
          private-key: ${{ secrets['app-private-key'] }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}

      - name: Resolve Workflow Source
        id: workflow-source
        run: |
          set -euo pipefail
          WORKFLOW_REF="${{ github.workflow_ref }}"
          echo "DEBUG: Full workflow_ref: ${WORKFLOW_REF}"
          
          SOURCE_REPO="${WORKFLOW_REF%%/.github/workflows/*}"
          echo "DEBUG: Extracted repository: ${SOURCE_REPO}"
          
          SOURCE_REF="${WORKFLOW_REF##*@}"
          echo "DEBUG: Extracted ref: ${SOURCE_REF}"
          
          if [[ -z "${SOURCE_REPO}" ]] || [[ -z "${SOURCE_REF}" ]]; then
            echo "ERROR: Failed to parse workflow_ref"
            exit 1
          fi
          
          echo "repo=${SOURCE_REPO}" >> "$GITHUB_OUTPUT"
          echo "ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout Workflow Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.workflow-source.outputs.repo }}
          ref: ${{ steps.workflow-source.outputs.ref }}
          path: workflow-source

      - name: Verify Checkout
        run: |
          echo "DEBUG: Workspace contents:"
          ls -la "${{ github.workspace }}"
          echo ""
          echo "DEBUG: workflow-source exists?"
          ls -la "${{ github.workspace }}/workflow-source" || echo "workflow-source directory NOT FOUND"
          echo ""
          echo "DEBUG: workflow-source/scripts exists?"
          ls -la "${{ github.workspace }}/workflow-source/scripts" || echo "scripts directory NOT FOUND"
          echo ""
          echo "DEBUG: Looking for the script:"
          ls -la "${{ github.workspace }}/workflow-source/scripts/add_issue_to_project.sh" || echo "SCRIPT NOT FOUND"

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Add issue to project and apply optional metadata
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs['issue-number'] != '' && inputs['issue-number'] || github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          PROJECT_OWNER: ${{ inputs['project-owner'] }}
          PROJECT_TITLE: ${{ inputs['project-title'] }}
          PROJECT_FIELDS_JSON_RAW: ${{ inputs['project-fields-json'] }}
        run: bash "${{ github.workspace }}/workflow-source/scripts/add_issue_to_project.sh"

      - name: Slack failure notification
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":no_entry: Failed GitHub Action:"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Job:*\n${{ github.job }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repo:*\n${{ github.repository }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets['slack-webhook-url'] }}
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
