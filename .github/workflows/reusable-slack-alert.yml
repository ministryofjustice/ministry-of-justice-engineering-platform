---
name: Reusable - Slack Alert

on:
  workflow_call:
    inputs:
      status:
        description: Status of the caller job or workflow ("success", "failure", "skipped", "cancelled")
        required: true
        type: string
      workflow-name:
        description: Name of the calling workflow
        required: false
        type: string
    secrets:
      slack-webhook-url:
        description: Slack webhook URL for notifications
        required: true

permissions: {}

jobs:
  send-slack-alert:
    name: Send Slack Alert
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets['slack-webhook-url'] }}
    permissions:
      contents: read
    steps:
      - name: Send Slack Alert
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ case(inputs.status == 'failure', '#ff0000', inputs.status == 'success', '#36a64f', inputs.status == 'skipped','#f2b613', '#808080') }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "${{ case(inputs.status == 'failure', '❌ Workflow Failure', inputs.status == 'success', '✅ Workflow Success', inputs.status == 'skipped', '⚠️ Workflow Skipped', inputs.status == 'cancelled', '🚫 Workflow Cancelled', 'ℹ️ Workflow Status Unknown') }}",
                        "emoji": true
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repository:*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Workflow:*\n ${{ inputs.workflow-name != '' && inputs.workflow-name || github.workflow }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Branch / Tag:*\n`${{ github.ref_name }}`"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Triggered by:*\n`${{ github.event_name }}` by @${{ github.actor }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Status:*\n${{ inputs.status }}"
                        }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Run Logs",
                            "emoji": true
                          },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                          "style": "primary"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
